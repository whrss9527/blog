name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: whrss9527/blog-data
          path: blog-data
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build the site and the one-file preview
        run: node scripts/build.mjs --data blog-data --preview
      # Download from the run page: unzip, then `npx serve`-style any static server,
      # or just open preview.html.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 14
